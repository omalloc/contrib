syntax = "proto3";

package protobuf.v2;

option go_package = "github.com/omalloc/contrib/v2/protobuf";
option java_multiple_files = true;
option java_package = "com.omalloc.protobuf.v2";
option objc_class_prefix = "Registry";

message Registry {
  // 是否启用服务注册
  bool enabled = 1;
  // 是否只作为服务发现，不自注册
  bool only_discovery = 2;
  // 服务注册中心地址
  repeated string endpoints = 3;
  // 服务命名空间
  string namespace = 4;
}
